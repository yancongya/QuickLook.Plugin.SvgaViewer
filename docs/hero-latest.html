<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--a:#0879e8;--rgb:8,121,232;--p:#eaf5ff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:transparent;font:12px/1.45 "Segoe UI",system-ui,sans-serif;color:#657891;user-select:none}.scene{position:relative;width:500px;height:440px;max-width:100%;margin:auto;overflow:hidden}.scene.svga{--a:#7739d8;--rgb:119,57,216;--p:#f2e8ff}.back{position:absolute;left:-20px;right:18px;top:43px;height:320px;overflow:hidden;background:radial-gradient(ellipse at 68% 48%,rgba(var(--rgb),.11),transparent 65%),linear-gradient(110deg,#fff,#fdfaff 65%,#f7f0ff)}.dots{position:absolute;inset:0;opacity:.2;background:radial-gradient(rgba(var(--rgb),.45) .8px,transparent .8px) 0 0/19px 19px}.marks{position:absolute;inset:8px 0;display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(3,1fr);gap:12px;opacity:0}.svga .marks{opacity:.65}.marks i{border-radius:50%;display:grid;place-items:center;background:rgba(125,50,215,.11)}.marks img{width:52%;height:52%;object-fit:contain;filter:none;opacity:.92}.label{position:absolute;left:13px;top:42px;color:#9aa9bd;font-size:10px;letter-spacing:.04em}.stage{position:absolute;left:2px;right:42px;top:65px;height:253px;border:1px solid #d8e2ef;border-radius:13px;background:radial-gradient(ellipse at 50% 55%,rgba(var(--rgb),.07),#ffffff88 70%)}.card{position:absolute;left:50%;top:43px;transform:translateX(-50%);width:104px;height:130px;border:1px solid #b9cce1;border-radius:12px;background:#fff;box-shadow:0 9px 22px #2b4d7718;display:flex;align-items:center;flex-direction:column;padding:22px 13px 9px;cursor:pointer;transition:.2s}.card:hover,.card.selected{border-color:rgba(var(--rgb),.55);box-shadow:0 12px 24px rgba(var(--rgb),.17)}.icon{width:30px;height:30px;border-radius:8px;background:var(--p);display:grid;place-items:center;margin-bottom:9px}.icon img{width:21px;height:21px;object-fit:contain}.line{width:76px;height:4px;background:#dbe5f0;border-radius:8px;margin:3px}.line.short{width:58px;margin-right:18px}.ext{margin-top:4px;padding:5px 12px;background:var(--a);color:white;border-radius:5px;font-size:10px;letter-spacing:.08em}.filename{position:absolute;top:187px;left:0;right:0;text-align:center}.key{position:absolute;left:33%;top:348px;width:166px;height:48px;padding:5px;border:1px solid #cdd9e7;border-radius:11px;background:#fff;box-shadow:0 4px 8px #183b6012;cursor:pointer}.key:before{content:"";display:block;height:100%;border:1px solid #e1e9f2;border-radius:7px;background:#fbfcfe}.key b{position:absolute;inset:0;display:grid;place-items:center;color:#97a8bd;font-size:13px;letter-spacing:.13em}.caption{position:absolute;top:406px;left:0;right:42px;text-align:center;color:#9aa9bd;font-size:10px}.preview{position:absolute;z-index:2;left:30%;right:5%;top:20px;height:210px;border-radius:12px;background:#111a2a;box-shadow:0 16px 36px #17263d55;opacity:0;transform:translate(18px,12px) scale(.97);pointer-events:none;transition:.25s}.preview.open{opacity:1;transform:none}.title{height:34px;padding:10px 12px;background:#263148;color:#edf3fb;border-radius:12px 12px 0 0;font-size:10px}.canvas{position:absolute;inset:42px 8px 38px;display:grid;place-items:center;background-color:#171e2e;background-image:linear-gradient(45deg,#252e42 25%,transparent 25%),linear-gradient(-45deg,#252e42 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#252e42 75%),linear-gradient(-45deg,transparent 75%,#252e42 75%);background-size:18px 18px;background-position:0 0,0 9px,9px -9px,-9px 0}.orb{width:72px;height:72px;border-radius:50%;border:5px solid var(--a);border-left-color:transparent;position:relative;animation:spin 6s linear infinite}.orb:before{content:"";position:absolute;inset:11px;border:4px solid #8cddff;border-bottom-color:transparent;border-radius:50%}.orb:after{content:"";position:absolute;inset:25px;border-radius:50%;background:radial-gradient(circle at 30% 25%,white,#6ecfff,var(--a));box-shadow:0 0 15px rgba(var(--rgb),.5)}.controls{position:absolute;bottom:0;left:0;right:0;height:30px;display:flex;align-items:center;gap:9px;padding:0 11px;color:#c5d0e1;font-size:9px}.bar{height:3px;flex:1;background:linear-gradient(90deg,var(--a) 42%,#414b61 42%)}.paused *,.paused *:before,.paused *:after{animation-play-state:paused!important}@keyframes spin{to{transform:rotate(390deg)}}@media(max-width:520px){.scene{transform:scale(.92);transform-origin:top center}.stage,.back{right:18px}.caption{right:18px}}
</style><body><main id="scene" class="scene"><div class="back"><div class="dots"></div><div class="marks" aria-hidden="true"><i><img src="./assets/svga-logo.png"></i><i><img src="./assets/svga-logo.png"></i><i><img src="./assets/svga-logo.png"></i><i><img src="./assets/svga-logo.png"></i><i><img src="./assets/svga-logo.png"></i><i><img src="./assets/svga-logo.png"></i><i><img src="./assets/svga-logo.png"></i><i><img src="./assets/svga-logo.png"></i><i><img src="./assets/svga-logo.png"></i><i><img src="./assets/svga-logo.png"></i><i><img src="./assets/svga-logo.png"></i><i><img src="./assets/svga-logo.png"></i></div></div><span id="label" class="label">动效素材 / PAG</span><section class="stage"><button id="file" class="card selected" type="button"><span class="icon"><img id="icon" src="./assets/quicklook-icon.png" alt=""></span><i class="line"></i><i class="line short"></i><i class="line"></i><span id="ext" class="ext">PAG</span></button><span id="filename" class="filename">animated.pag</span><div id="preview" class="preview"><div id="title" class="title">animated.pag · QuickLook</div><div class="canvas"><i class="orb"></i></div><div class="controls"><span>Ⅱ</span><span>⟲</span><i class="bar"></i><span>0:02 / 0:06</span>◖</div></div></section><button id="key" class="key"><b>SPACE</b></button><span class="caption">点击或框选文件，再按空格预览</span></main><script>
const s=document.querySelector("#scene"),svga=true,p=document.querySelector("#preview"),key=document.querySelector("#key");s.classList.add("svga");document.querySelector("#label").textContent="动效素材 / SVGA";document.querySelector("#icon").src="./assets/quicklook-icon.png";document.querySelectorAll(".marks img").forEach(i=>i.src="./assets/svga-logo.png");document.querySelector("#ext").textContent="SVGA";document.querySelector("#filename").textContent="animated.svga";document.querySelector("#title").textContent="animated.svga · QuickLook";let opened=false;function toggle(phase){if(phase==="down")p.classList.toggle("open",opened=!opened)}key.onclick=()=>toggle("down");document.querySelector("#file").onclick=e=>e.currentTarget.classList.toggle("selected");window.addEventListener("keydown",e=>{if(e.code==="Space"&&!e.repeat){e.preventDefault();toggle("down")}});window.addEventListener("message",e=>{if(e.origin!==location.origin)return;let d=e.data||{};if(d.type==="hero-key")toggle(d.phase);if(d.type==="motion")s.classList.toggle("paused",!!d.paused)});
</script></body></html>
