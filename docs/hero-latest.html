<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--accent:#0879e8;--accent2:#19b9e5;--pale:#eaf5ff;--ink:#1c2a3e;--muted:#798ba2;--dark:#111a2a}*{box-sizing:border-box}body{margin:0;background:transparent;font:13px/1.45 "Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);user-select:none}.window{position:absolute;inset:20px 18px 44px;border:1px solid #d9e2ed;border-radius:13px;background:#fff;box-shadow:0 18px 50px #1d467333;overflow:hidden;transition:transform .24s,opacity .24s}.bar{height:35px;display:flex;align-items:center;padding:0 12px;gap:8px;color:#63758d;border-bottom:1px solid #edf1f5}.dots{display:flex;gap:4px}.dots i{width:7px;height:7px;border-radius:50%;background:#d7e0eb}.crumb{margin-left:8px;font-size:10px}.files{position:absolute;left:0;top:35px;bottom:0;width:47%;padding:14px 12px;background:#f9fbfe}.row{height:49px;display:flex;align-items:center;gap:9px;padding:0 9px;border:1px solid transparent;border-radius:7px;color:#53657c;font-size:11px;cursor:pointer;transition:background .18s,border-color .18s}.row.selected{background:var(--pale);border-color:#c4e1ff;color:#25496c}.fileicon{width:22px;height:27px;border-radius:4px 4px 6px 4px;background:linear-gradient(145deg,var(--accent2),var(--accent));position:relative;box-shadow:0 2px 5px #157ce933}.fileicon:after{content:"";position:absolute;right:0;top:0;border-left:7px solid transparent;border-bottom:7px solid #ffffff77}.preview{position:absolute;left:39%;right:2%;top:31%;height:62%;min-height:155px;border-radius:11px;overflow:hidden;background:linear-gradient(145deg,#222b40,#111827);box-shadow:0 16px 34px #101a2c44;opacity:0;transform:translate(30px,6px) scale(.96);transition:opacity .28s,transform .32s}.preview.open{opacity:1;transform:none}.pbar{height:30px;background:#263148;color:#e7edf7;display:flex;align-items:center;padding:0 10px;font-size:10px}.pbar span:last-child{margin-left:auto;color:#9baac0}.stage{height:calc(100% - 70px);min-height:112px;margin:8px;background-color:#171e2e;background-image:linear-gradient(45deg,#252e42 25%,transparent 25%),linear-gradient(-45deg,#252e42 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#252e42 75%),linear-gradient(-45deg,transparent 75%,#252e42 75%);background-size:18px 18px;background-position:0 0,0 9px,9px -9px,-9px 0;display:grid;place-items:center;overflow:hidden}.ribbon{width:42%;aspect-ratio:1;position:relative;filter:drop-shadow(0 4px 8px #0005);animation:float 4s ease-in-out infinite}.ribbon:before,.ribbon:after{content:"";position:absolute;inset:9%;border-radius:60% 35% 58% 40%;border:9px solid #45c7ef;border-left-color:transparent;border-bottom-color:#88e1fa;transform:rotate(35deg);animation:spin 7s linear infinite}.ribbon:after{inset:23%;border-width:7px;border-color:#c0f3ff #56bde9 transparent #a7eaff;transform:rotate(-42deg);animation-direction:reverse}.orb{position:absolute;inset:39%;border-radius:50%;background:radial-gradient(circle at 35% 28%,#fff,#78e3ff 35%,#178de4 75%);box-shadow:0 0 20px #6bd5ff99}.controls{position:absolute;bottom:0;left:0;right:0;height:32px;display:flex;align-items:center;gap:9px;padding:0 10px;background:#0d1422;color:#b8c6da;font-size:9px}.track{height:3px;flex:1;border-radius:4px;background:linear-gradient(90deg,var(--accent2) 42%,#3b465b 42%)}.space{position:absolute;left:24%;bottom:4px;padding:6px 15px;border:1px solid #e4eaf1;border-radius:7px;background:#fff;box-shadow:0 7px 17px #32567a22;color:#61758d;font-size:10px;transition:transform .2s}.space kbd{font:600 10px system-ui;color:#293d57}.hint{position:absolute;right:20px;bottom:8px;color:#8898ad;font-size:9px}.window.pulse{animation:pulse .34s ease}.paused *, .paused *:before,.paused *:after{animation-play-state:paused!important}@keyframes spin{to{transform:rotate(395deg)}}@keyframes float{50%{transform:translateY(-5px)}}@keyframes pulse{50%{transform:scale(.985)}}@media(max-width:520px){.window{inset:10px 4px 43px}.files{width:50%;padding:9px 6px}.row{gap:6px;padding:0 5px;font-size:9px;height:43px}.fileicon{width:18px;height:23px}.preview{left:37%;right:1%;top:33%;height:59%;min-height:125px}.bar{height:29px}.crumb{font-size:8px}.stage{min-height:90px}.space{left:20%;bottom:5px;padding:5px 11px}}
</style></head><body><div class="window" id="window"><div class="bar"><span class="dots"><i></i><i></i><i></i></span><span>文件资源管理器</span><span class="crumb">素材　›　Motion　›　ANIMATION</span></div><div class="files"><div class="row selected" id="file"><span class="fileicon"></span><span id="filename">animated.pag</span></div><div class="row"><span class="fileicon"></span><span>loading.pag</span></div><div class="row"><span class="fileicon"></span><span>transition.pag</span></div></div><div class="preview open" id="preview"><div class="pbar"><span id="title">animated.pag · QuickLook</span><span>−　□　×</span></div><div class="stage"><div class="ribbon"><i class="orb"></i></div></div><div class="controls"><span>Ⅱ</span><span>⟲</span><span class="track"></span><span>0:02 / 0:06</span><span>◖</span></div></div><div class="space"><kbd>Space</kbd>　预览动画</div></div><span class="hint">选择文件，按空格预览</span><script>
const isSvga=new URLSearchParams(location.search).get("product")==="svga";if(isSvga){document.documentElement.style.setProperty("--accent","#7739d8");document.documentElement.style.setProperty("--accent2","#c04ae6");document.documentElement.style.setProperty("--pale","#f4eaff");document.getElementById("filename").textContent="animated.svga";document.getElementById("title").textContent="animated.svga · QuickLook"}const win=document.getElementById("window"),preview=document.getElementById("preview"),file=document.getElementById("file");let opened=true;function toggle(phase){if(phase==="down"){opened=!opened;preview.classList.toggle("open",opened);win.classList.remove("pulse");void win.offsetWidth;win.classList.add("pulse")}}file.addEventListener("click",()=>{file.classList.add("selected");preview.classList.add("open");opened=true});window.addEventListener("keydown",e=>{if(e.code==="Space"&&!e.repeat){e.preventDefault();toggle("down")}});window.addEventListener("keyup",e=>{if(e.code==="Space")toggle("up")});window.addEventListener("message",e=>{if(e.origin!==location.origin)return;const d=e.data||{};if(d.type==="hero-key")toggle(d.phase);if(d.type==="motion")document.body.classList.toggle("paused",!!d.paused)});
</script></body></html>
