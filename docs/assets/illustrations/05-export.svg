x="28" fill="#fff" /><circle cx="369" cy="613" r="13" fill="#e0f7f0"/><path d="M363 613L368 618L376 607" fill="none" stroke="#13a17b" stroke-width="2.5" stroke-linecap="round"/><text x="395" y="620" class="s" fill="#3f536b">当前帧已保存到 SVGA 文件旁</text></g><g class="export-cursor"><use href="#cursor" x="593" y="488" width="28" height="36" /></g><g opacity=".85"><rect x="510" y="178" width="112" height="30" rx="6" fill="#171d2d" /><circle cx="528" cy="193" r="7" stroke="#acbfdc" fill="none"/><text x="526" y="198" class="tiny" >i</text><path d="M558 185h13v16h-13zM561 188h7v5h-7zM561 201v-5h7v5" fill="none" stroke="#acbfdc" stroke-width="1.4"/><rect x="594" y="186" width="15" height="15" rx="2" fill="#c1cce0" /><rect x="594" y="186" width="8" height="8" rx="0" fill="#65758e" /><rect x="602" y="194" width="7" height="7" rx="0" fill="#65758e" /></g></svg>