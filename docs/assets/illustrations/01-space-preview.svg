</defs><style>
.play-progress{transform-box:fill-box;transform-origin:left;animation:progress 8s linear infinite}
@keyframes progress{0%{transform:scaleX(.05)}90%,100%{transform:scaleX(1.6)}}
text{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.s{font-size:17px;fill:#8c96aa}.tiny{font-size:13px;fill:#8491a7}.label{font-size:20px;fill:#42506b}.white{fill:#edf4ff}.bold{font-weight:600}.mono{font-family:Consolas,monospace}
:root:not([data-run="playing"]) *{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

.selection{animation:select 8s infinite}.viewer{transform-origin:750px 380px;animation:open 8s infinite}.space-key{animation:press 8s infinite}.cursor{animation:pointer 8s infinite}.art-move{animation:art 8s ease-in-out infinite}
@keyframes select{0%,8%{opacity:.3}16%,100%{opacity:1}}
@keyframes open{0%,18%{opacity:1;transform:translate(28px,20px) scale(.94)}30%,85%{opacity:1;transform:none}97%,100%{opacity:1;transform:translate(0,8px) scale(.98)}}
@keyframes press{0%,15%,30%,100%{transform:none}21%{transform:translateY(4px)}}
@keyframes pointer{0%{transform:translate(-60px,70px)}15%,100%{transform:none}}
@keyframes art{0%,30%,100%{transform:none}60%{transform:translate(0,-9px) rotate(3deg)}}
