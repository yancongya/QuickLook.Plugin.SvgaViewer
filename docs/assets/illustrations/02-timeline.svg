<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1068 720" role="img" aria-labelledby="title desc" data-run="paused">
<title id="title">播放、暂停与时间轴定位</title><desc id="desc">SvgaViewer 功能示意；分层 SVG 操作场景与 AI 生成的 SVGA 动效示意素材，不是 Windows 实测截图。</desc>
<defs>
<linearGradient id="paper" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#edf2fa"/></linearGradient>
<linearGradient id="blue" x1=".2" y1="0" x2=".8" y2="1"><stop stop-color="#d59bff"/><stop offset=".46" stop-color="#8e42e8"/><stop offset="1" stop-color="#5d27bb"/></linearGradient>
<linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a98bff"/><stop offset=".48" stop-color="#7161ee"/><stop offset="1" stop-color="#3444bd"/></linearGradient>
<linearGradient id="mint" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#e2c4ff"/><stop offset=".5" stop-color="#b87af1"/><stop offset="1" stop-color="#7137ca"/></linearGradient>
<linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#24273e"/><stop offset="1" stop-color="#101525"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".75"/><stop offset=".4" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#cfa5fb" stop-opacity=".2"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#d6b2fa" stop-opacity=".4"/><stop offset="1" stop-color="#d6b2fa" stop-opacity="0"/></radialGradient>
<filter id="shadow" x="-35%" y="-35%" width="180%" height="190%"><feDropShadow dx="0" dy="17" stdDeviation="18" flood-color="#162753" flood-opacity=".17"/></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#12295a" flood-opacity=".12"/></filter>
<pattern id="checker" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="32" height="32" fill="#f4f5f8"/><path d="M0 0H16V16H0ZM16 16H32V32H16Z" fill="#dfe3ec"/></pattern>
<pattern id="dark-checker" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="32" height="32" fill="#202437"/><path d="M0 0H16V16H0ZM16 16H32V32H16Z" fill="#262b40"/></pattern>
<symbol id="folder" viewBox="0 0 40 34"><path d="M2 6Q2 2 6 2H17L22 7H35Q39 7 39 12V29Q39 33 35 33H6Q2 33 2 29Z" fill="#ffcc62"/><path d="M1 12H39L35 31H4Z" fill="#ffe49a"/></symbol>
<symbol id="svgafile" viewBox="0 0 48 58"><path d="M5 1H30L46 17V52Q46 57 41 57H5Q1 57 1 52V6Q1 1 5 1Z" fill="url(#blue)"/><path d="M30 1V17H46" fill="#ead4ff"/><path d="M14 42V25H24Q32 25 32 32T24 39H14M14 33H24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="cursor" viewBox="0 0 28 36"><path d="M3 1V29L10 23L16 34L21 31L15 20H25Z" fill="#fff" stroke="#263754" stroke-width="2"/></symbol>
<symbol id="art" viewBox="0 0 320 300">
  <ellipse cx="160" cy="279" rx="101" ry="11" fill="#11295c" opacity=".13"/>
  <image href="./svga-ribbon-art.png" x="10" y="0" width="300" height="280" preserveAspectRatio="xMidYMid meet"/>
</symbol>
</defs><style>
.play-progress{transform-box:fill-box;transform-origin:left;animation:progress 8s linear infinite}
@keyframes progress{0%{transform:scaleX(.05)}90%,100%{transform:scaleX(1.6)}}
text{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.s{font-size:17px;fill:#8c96aa}.tiny{font-size:13px;fill:#8491a7}.label{font-size:20px;fill:#42506b}.white{fill:#edf4ff}.bold{font-weight:600}.mono{font-family:Consolas,monospace}
:root:not([data-run="playing"]) *{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

.play-progress{animation:scrub-progress 9s ease-in-out infinite}@keyframes scrub-progress{0%,10%,100%{transform:scaleX(.15)}40%,57%{transform:scaleX(1.8)}75%,90%{transform:scaleX(1)}}
.scrub-art{transform-origin:534px 300px;animation:frame 9s ease-in-out infinite}.playhead{animation:seek 9s ease-in-out infinite}.scrub-cursor{animation:cursor 9s ease-in-out infinite}
@keyframes frame{0%,10%,100%{transform:translate(-38px,0) rotate(-8deg) scale(.92)}40%,57%{transform:translate(33px,-13px) rotate(8deg) scale(1.08)}75%,90%{transform:translate(0,0) rotate(0) scale(1)}}
@keyframes seek{0%,10%,100%{transform:translateX(-190px)}40%,57%{transform:translateX(192px)}75%,90%{transform:translateX(0)}}
@keyframes cursor{0%,10%,100%{transform:translateX(-150px)}40%,57%{transform:translateX(230px)}75%,90%{transform:translateX(40px)}}
</style><rect x="24" y="42" width="1020" height="626" rx="24" fill="#edf0f9" /><g filter="url(#shadow)"><rect x="89" y="88" width="890" height="504" rx="13" fill="url(#dark)" /><rect x="89" y="88" width="890" height="46" rx="10" fill="#292d43" /><rect x="89" y="110" width="890" height="24" rx="0" fill="#292d43" /><text x="109" y="117" class="s white" >brand-motion.svga · QuickLook</text><text x="876" y="116" class="s white" >−    □    ×</text><path d="M89 134H979" stroke="#353b54"/><rect x="105" y="142" width="858" height="348" rx="4" fill="url(#dark)" /><ellipse cx="534" cy="330" rx="360" ry="200" fill="url(#glow)"/><g opacity=".16"><image href="./svga-ribbon-art.png" x="130" y="205" width="220" height="207" preserveAspectRatio="xMidYMid meet" /><image href="./svga-ribbon-art.png" x="718" y="205" width="220" height="207" preserveAspectRatio="xMidYMid meet" /></g><g class="scrub-art"><image href="./svga-ribbon-art.png" x="365" y="146" width="338" height="317" preserveAspectRatio="xMidYMid meet" /></g><text x="132" y="177" class="tiny" >500 × 500</text><text x="132" y="202" class="tiny" >30 FPS</text><text x="133" y="469" class="tiny" >预览画面 · 示例素材</text><rect x="106" y="497" width="856" height="48" rx="8" fill="#171d2d" /><path d="M124 513V529M131 513V529" stroke="#d8deec" stroke-width="3"/><path d="M153 518a8 8 0 1 1 0 8M151 515v7h7" fill="none" stroke="#92a7c7" stroke-width="2"/><rect x="186" y="519" width="594" height="3" rx="2" fill="#414b61" /><rect x="186" y="519" width="249.48" height="3" rx="2" fill="#5c9bff" class="play-progress"/><text x="799" y="526" class="tiny" >0:02 / 0:06</text><path d="M911 517h5l6-5v18l-6-5h-5zM926 516q7 5 0 10" fill="none" stroke="#b9c9df" stroke-width="1.7" stroke-linejoin="round"/></g><g filter="url(#soft)"><rect x="184" y="570" width="700" height="90" rx="10" fill="#fff" /><rect x="198" y="582" width="83" height="63" rx="4" fill="#eef0fa" /><image href="./svga-ribbon-art.png" x="214" y="583" width="49" height="55" preserveAspectRatio="xMidYMid meet" transform="rotate(-18 239 610)"/><rect x="294" y="582" width="83" height="63" rx="4" fill="#eef0fa" /><image href="./svga-ribbon-art.png" x="310" y="583" width="49" height="55" preserveAspectRatio="xMidYMid meet" transform="rotate(-12 335 610)"/><rect x="390" y="582" width="83" height="63" rx="4" fill="#eef0fa" /><image href="./svga-ribbon-art.png" x="406" y="583" width="49" height="55" preserveAspectRatio="xMidYMid meet" transform="rotate(-6 431 610)"/><rect x="486" y="582" width="83" height="63" rx="4" fill="#eef0fa" /><image href="./svga-ribbon-art.png" x="502" y="583" width="49" height="55" preserveAspectRatio="xMidYMid meet" transform="rotate(0 527 610)"/><rect x="582" y="582" width="83" height="63" rx="4" fill="#eef0fa" /><image href="./svga-ribbon-art.png" x="598" y="583" width="49" height="55" preserveAspectRatio="xMidYMid meet" transform="rotate(6 623 610)"/><rect x="678" y="582" width="83" height="63" rx="4" fill="#eef0fa" /><image href="./svga-ribbon-art.png" x="694" y="583" width="49" height="55" preserveAspectRatio="xMidYMid meet" transform="rotate(12 719 610)"/><rect x="774" y="582" width="83" height="63" rx="4" fill="#eef0fa" /><image href="./svga-ribbon-art.png" x="790" y="583" width="49" height="55" preserveAspectRatio="xMidYMid meet" transform="rotate(18 815 610)"/><g class="playhead"><rect x="459" y="577" width="87" height="73" rx="5" fill="none" stroke="#7739d8" stroke-width="3"/><path d="M502 569V658" stroke="#7739d8" stroke-width="2"/><path d="M494 569H510L502 580Z" fill="#7739d8"/></g></g><g class="scrub-cursor"><use href="#cursor" x="553" y="525" width="28" height="36" /></g><g opacity=".85"><rect x="847" y="146" width="112" height="30" rx="6" fill="#171d2d" /><circle cx="865" cy="161" r="7" stroke="#acbfdc" fill="none"/><text x="863" y="166" class="tiny" >i</text><path d="M895 153h13v16h-13zM898 156h7v5h-7zM898 169v-5h7v5" fill="none" stroke="#acbfdc" stroke-width="1.4"/><rect x="931" y="154" width="15" height="15" rx="2" fill="#c1cce0" /><rect x="931" y="154" width="8" height="8" rx="0" fill="#65758e" /><rect x="939" y="162" width="7" height="7" rx="0" fill="#65758e" /></g></svg>