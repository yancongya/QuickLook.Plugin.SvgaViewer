<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1068 720" role="img" aria-labelledby="title desc" data-run="paused">
<title id="title">查看文件信息和渲染性能</title><desc id="desc">SvgaViewer 功能示意；分层 SVG 操作场景与 AI 生成的 SVGA 动效示意素材，不是 Windows 实测截图。</desc>
<defs>
<linearGradient id="paper" x2="0" y2="1"><stop stop-color="#ffffff"/><stop offset="1" stop-color="#edf2fa"/></linearGradient>
<linearGradient id="blue" x1=".2" y1="0" x2=".8" y2="1"><stop stop-color="#d59bff"/><stop offset=".46" stop-color="#8e42e8"/><stop offset="1" stop-color="#5d27bb"/></linearGradient>
<linearGradient id="ribbon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#a98bff"/><stop offset=".48" stop-color="#7161ee"/><stop offset="1" stop-color="#3444bd"/></linearGradient>
<linearGradient id="mint" x1="0" y1="0" x2=".8" y2="1"><stop stop-color="#e2c4ff"/><stop offset=".5" stop-color="#b87af1"/><stop offset="1" stop-color="#7137ca"/></linearGradient>
<linearGradient id="dark" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#24273e"/><stop offset="1" stop-color="#101525"/></linearGradient>
<linearGradient id="glass" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff" stop-opacity=".75"/><stop offset=".4" stop-color="#fff" stop-opacity=".04"/><stop offset="1" stop-color="#cfa5fb" stop-opacity=".2"/></linearGradient>
<radialGradient id="glow"><stop stop-color="#d6b2fa" stop-opacity=".4"/><stop offset="1" stop-color="#d6b2fa" stop-opacity="0"/></radialGradient>
<filter id="shadow" x="-35%" y="-35%" width="180%" height="190%"><feDropShadow dx="0" dy="17" stdDeviation="18" flood-color="#162753" flood-opacity=".17"/></filter>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#12295a" flood-opacity=".12"/></filter>
<pattern id="checker" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="32" height="32" fill="#f4f5f8"/><path d="M0 0H16V16H0ZM16 16H32V32H16Z" fill="#dfe3ec"/></pattern>
<pattern id="dark-checker" width="32" height="32" patternUnits="userSpaceOnUse"><rect width="32" height="32" fill="#202437"/><path d="M0 0H16V16H0ZM16 16H32V32H16Z" fill="#262b40"/></pattern>
<symbol id="folder" viewBox="0 0 40 34"><path d="M2 6Q2 2 6 2H17L22 7H35Q39 7 39 12V29Q39 33 35 33H6Q2 33 2 29Z" fill="#ffcc62"/><path d="M1 12H39L35 31H4Z" fill="#ffe49a"/></symbol>
<symbol id="svgafile" viewBox="0 0 48 58"><path d="M5 1H30L46 17V52Q46 57 41 57H5Q1 57 1 52V6Q1 1 5 1Z" fill="url(#blue)"/><path d="M30 1V17H46" fill="#ead4ff"/><path d="M14 42V25H24Q32 25 32 32T24 39H14M14 33H24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<symbol id="cursor" viewBox="0 0 28 36"><path d="M3 1V29L10 23L16 34L21 31L15 20H25Z" fill="#fff" stroke="#263754" stroke-width="2"/></symbol>
<symbol id="art" viewBox="0 0 320 300">
  <ellipse cx="160" cy="279" rx="101" ry="11" fill="#11295c" opacity=".13"/>
  <image href="./svga-ribbon-art.png" x="10" y="0" width="300" height="280" preserveAspectRatio="xMidYMid meet"/>
</symbol>
</defs><style>
.play-progress{transform-box:fill-box;transform-origin:left;animation:progress 8s linear infinite}
@keyframes progress{0%{transform:scaleX(.05)}90%,100%{transform:scaleX(1.6)}}
text{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
.s{font-size:17px;fill:#8c96aa}.tiny{font-size:13px;fill:#8491a7}.label{font-size:20px;fill:#42506b}.white{fill:#edf4ff}.bold{font-weight:600}.mono{font-family:Consolas,monospace}
:root:not([data-run="playing"]) *{animation-play-state:paused!important}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}

.information{animation:info 9s ease-in-out infinite}.perf-progress{transform-origin:643px 600px;animation:perf 9s ease-in-out infinite}.info-cursor{animation:point 9s infinite}
@keyframes info{0%,8%{opacity:.96;transform:translateX(18px)}22%,90%{opacity:1;transform:none}100%{opacity:.96;transform:translateX(18px)}}
@keyframes perf{0%,15%,100%{transform:scaleX(.8)}40%{transform:scaleX(1.1)}70%{transform:scaleX(.94)}}
@keyframes point{0%,100%{transform:translate(-70px,55px)}18%,88%{transform:none}}
</style><rect x="24" y="42" width="1020" height="626" rx="24" fill="#f4f4fb" /><g filter="url(#shadow)"><rect x="79" y="100" width="720" height="486" rx="13" fill="url(#dark)" /><rect x="79" y="100" width="720" height="46" rx="10" fill="#292d43" /><rect x="79" y="122" width="720" height="24" rx="0" fill="#292d43" /><text x="99" y="129" class="s white" >brand-motion.svga · QuickLook</text><text x="696" y="128" class="s white" >−    □    ×</text><path d="M79 146H799" stroke="#353b54"/><rect x="94" y="154" width="690" height="359" rx="5" fill="url(#dark-checker)" /><image href="./svga-ribbon-art.png" x="233" y="167" width="370" height="347" preserveAspectRatio="xMidYMid meet" /><rect x="94" y="523" width="690" height="48" rx="8" fill="#171d2d" /><path d="M112 539V555M119 539V555" stroke="#d8deec" stroke-width="3"/><path d="M141 544a8 8 0 1 1 0 8M139 541v7h7" fill="none" stroke="#92a7c7" stroke-width="2"/><rect x="174" y="545" width="428" height="3" rx="2" fill="#414b61" /><rect x="174" y="545" width="179.76" height="3" rx="2" fill="#5c9bff" class="play-progress"/><text x="621" y="552" class="tiny" >0:02 / 0:06</text><path d="M733 543h5l6-5v18l-6-5h-5zM748 542q7 5 0 10" fill="none" stroke="#b9c9df" stroke-width="1.7" stroke-linejoin="round"/></g><g class="information" filter="url(#shadow)"><rect x="669" y="158" width="331" height="346" rx="12" fill="#fff" /><text x="693" y="196" class="label bold" >文件信息</text><text x="693" y="222" class="tiny" >brand-motion.svga</text><path d="M693 239H975" stroke="#e9edf4"/><text x="693" y="274" class="s" >画布尺寸</text><text x="974" y="274" class="s bold" text-anchor="end" fill="#34435c">500 × 500</text><text x="693" y="319" class="s" >动画时长</text><text x="974" y="319" class="s bold" text-anchor="end" fill="#34435c">6.00 s</text><text x="693" y="364" class="s" >帧率</text><text x="974" y="364" class="s bold" text-anchor="end" fill="#34435c">30 FPS</text><text x="693" y="409" class="s" >图层数</text><text x="974" y="409" class="s bold" text-anchor="end" fill="#34435c">12</text><rect x="692" y="441" width="282" height="39" rx="6" fill="#f0f6ff" /><circle cx="709" cy="460" r="4" fill="#1cae98"/><text x="722" y="466" class="tiny" fill="#376695">SVGAPlayer-Web</text></g><g filter="url(#soft)"><rect x="621" y="539" width="353" height="100" rx="10" fill="#fff" /><text x="643" y="570" class="tiny" >预览渲染状态 · 示意</text><text x="943" y="570" class="tiny" text-anchor="end" fill="#0066d9">30 FPS</text><rect x="643" y="597" width="308" height="7" rx="4" fill="#e9eff8" /><rect x="643" y="597" width="240" height="7" rx="4" fill="#4698e8" class="perf-progress"/><text x="643" y="625" class="tiny" >帧率显示与进度条颜色反馈</text></g><g class="info-cursor"><use href="#cursor" x="917" y="135" width="28" height="36" /></g></svg>