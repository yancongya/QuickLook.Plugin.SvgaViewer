<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <style>
        :root {
            --bg: #202020;
            --fg: #cccccc;
            --fg-alt: #888888;
            --accent: #e0e0e0;
            --control-bg: rgba(30,30,30,0.92);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: var(--bg); font-family: 'Segoe UI', sans-serif;
            user-select: none;
        }
        .icon { font-family: 'Segoe MDL2 Assets', 'Segoe Fluent Icons'; font-size: 14px; }

        #container {
            width: 100%; height: 100%;
            display: flex; align-items: center; justify-content: center;
            position: relative;
        }

        #bgLayer { position: absolute; inset: 0; z-index: 0; }
        #bgLayer.checker {
            background-color: #ffffff;
            background-image:
                linear-gradient(45deg, #e0e0e0 25%, transparent 25%),
                linear-gradient(-45deg, #e0e0e0 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #e0e0e0 75%),
                linear-gradient(-45deg, transparent 75%, #e0e0e0 75%);
            background-size: 16px 16px;
            background-position: 0 0, 0 8px, 8px -8px, -8px 0;
        }
        #bgLayer.checker.dark {
            background-color: #2a2a2a;
            background-image:
                linear-gradient(45deg, #333 25%, transparent 25%),
                linear-gradient(-45deg, #333 25%, transparent 25%),
                linear-gradient(45deg, transparent 75%, #333 75%),
                linear-gradient(-45deg, transparent 75%, #333 75%);
        }
        #bgLayer.white { background: #ffffff; }
        #bgLayer.black { background: #000000; }
        #bgLayer.default { background: var(--bg); }

        #canvas {
            position: relative; z-index: 1;
        }

        #canvasWrap {
            display: flex; align-items: center; justify-content: center;
            width: 100%; height: 100%;
            overflow: hidden;
        }

        #zoomInfo {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(80,80,80,0.9); color: #fff;
            padding: 4px 14px; border-radius: 5px;
            font-size: 18px; pointer-events: none;
            opacity: 0; z-index: 20; transition: opacity 0.2s;
        }

        #topBar {
            position: absolute; top: 8px; right: 8px;
            display: flex; gap: 4px;
            z-index: 25; opacity: 1; transition: opacity 0.3s;
        }
        #topBar.hidden { opacity: 0; pointer-events: none; }
        #topBar .btn {
            width: 24px; height: 24px;
            background: transparent; border: none; color: var(--fg);
            cursor: pointer; display: flex; align-items: center; justify-content: center;
            border-radius: 2px; transition: background 0.1s;
        }
        #topBar .btn:hover { background: rgba(255,255,255,0.1); }
        #topBar .btn .icon { font-size: 12px; }

        #metaPanel {
            position: absolute; top: 36px; right: 8px;
            background: var(--control-bg);
            padding: 8px 12px; border-radius: 4px;
            color: var(--fg); font-size: 11px;
            line-height: 1.6; z-index: 21;
            display: none; max-width: 280px;
            max-height: 300px; overflow-y: auto;
        }
        #metaPanel.show { display: block; }
        #metaPanel .label { color: var(--fg-alt); }
        #metaPanel hr { border-color: rgba(255,255,255,0.1); margin: 4px 0; }
        #metaPanel .meta-row { display: flex; justify-content: space-between; }
        #metaPanel .meta-row .label { flex: 0 0 auto; }
        #metaPanel .meta-row .value { text-align: right; }
        #metaPanel .image-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 2px 8px; margin-top: 4px;
        }
        #metaPanel .image-item {
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        /* Custom scrollbar */
        #metaPanel::-webkit-scrollbar { width: 4px; }
        #metaPanel::-webkit-scrollbar-track { background: transparent; }
        #metaPanel::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
        #metaPanel::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.3); }

        #colorPicker {
            position: absolute; top: 36px; right: 8px;
            background: var(--control-bg);
            padding: 8px; border-radius: 4px;
            display: none; z-index: 21;
            flex-direction: column; gap: 6px;
        }
        #colorPicker.show { display: flex; }
        #colorPicker input[type="color"] {
            width: 100%; height: 28px; border: none;
            cursor: pointer; background: transparent;
        }
        .colorSwatches { display: flex; gap: 4px; }
        .swatch {
            width: 20px; height: 20px; border: 1px solid rgba(255,255,255,0.2);
            cursor: pointer; border-radius: 2px;
        }
        .swatch:hover { border-color: var(--fg); }

        #controls {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: 32px; background: var(--control-bg);
            display: flex; align-items: center; padding: 0 8px;
            opacity: 1; transition: opacity 0.3s ease; z-index: 25;
        }
        #controls.hidden { opacity: 0; pointer-events: none; }

        .btn {
            background: transparent; border: none; color: var(--fg);
            width: 32px; height: 32px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            border-radius: 4px; transition: all 0.15s; flex-shrink: 0;
            position: relative;
        }
        .btn:hover { background: rgba(255,255,255,0.1); }
        .btn:active { background: rgba(255,255,255,0.15); }
        .btn.active { color: var(--accent); }
        .btn.pinned {
            background: rgba(255,255,255,0.18);
            color: var(--accent);
            box-shadow: inset 0 -2px 0 var(--accent);
        }

        #progressWrap {
            flex: 1; height: 10px; margin: 0 6px;
            position: relative; cursor: pointer;
            display: flex; align-items: center;
        }
        #progressBg {
            position: absolute; left: 10px; right: 10px;
            height: 1px; background: rgba(255,255,255,0.2);
            top: 50%; transform: translateY(-50%);
        }
        #progressFill {
            position: absolute; left: 10px; width: 0;
            height: 1px; background: var(--fg);
            top: 50%; transform: translateY(-50%);
        }
        #progressThumb {
            position: absolute; left: 10px;
            width: 10px; height: 10px;
            border: 1px solid var(--fg); border-radius: 50%;
            background: transparent;
            top: 50%; transform: translate(-50%, -50%);
            opacity: 0; transition: opacity 0.15s, background 0.15s; z-index: 2;
        }
        #progressWrap:hover #progressThumb { opacity: 1; }
        #progressWrap.dragging #progressThumb { opacity: 1; background: var(--fg); }
        #progressWrap:hover #progressFill { height: 2px; }
        #progressWrap:hover #progressBg { height: 2px; }

        #time {
            color: var(--fg); font-size: 11px;
            font-family: 'Segoe UI', sans-serif;
            min-width: 90px; text-align: center;
            flex-shrink: 0; white-space: nowrap;
        }

        #volumeLayer {
            position: absolute; bottom: 32px; right: 8px;
            width: 130px; height: 32px;
            background: var(--control-bg);
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none;
            transition: opacity 0.15s; z-index: 26;
        }
        #volumeLayer.show { opacity: 1; pointer-events: auto; }
        #volumeSlider {
            width: 110px; height: 4px;
            -webkit-appearance: none; appearance: none;
            background: rgba(255,255,255,0.2); outline: none;
            border-radius: 2px; cursor: pointer;
        }
        #volumeSlider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 10px; height: 10px;
            background: var(--fg); border-radius: 50%; cursor: pointer;
        }

        #status {
            position: absolute; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            color: var(--fg-alt); font-size: 13px; z-index: 1;
        }

        #toast {
            position: absolute; bottom: 44px; left: 50%;
            transform: translateX(-50%);
            background: rgba(80,80,80,0.95); color: #fff;
            padding: 6px 16px; border-radius: 4px;
            font-size: 12px; pointer-events: none;
            opacity: 0; z-index: 30; transition: opacity 0.3s;
        }
        #toast.show { opacity: 1; }

        /* Debug & playback options popup */
        #optsMenu {
            position: absolute; top: 36px; right: 8px; width: 224px;
            background: var(--control-bg); border: 1px solid rgba(255,255,255,0.12);
            border-radius: 6px; padding: 8px 10px; color: var(--fg); font-size: 11px;
            display: none; flex-direction: column; gap: 7px; z-index: 22;
            box-shadow: 0 6px 18px rgba(0,0,0,0.45);
        }
        #optsMenu.show { display: flex; }
        .opt-row { display: flex; justify-content: space-between; align-items: center; gap: 6px; }
        .opt-row label { color: var(--fg-alt); font-size: 10px; white-space: nowrap; }
        .opt-pills { display: flex; gap: 3px; flex-wrap: wrap; justify-content: flex-end; }
        .opt-pill {
            padding: 2px 6px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.15);
            background: transparent; color: var(--fg-alt); font-size: 10px; cursor: pointer;
        }
        .opt-pill:hover { color: var(--fg); border-color: rgba(255,255,255,0.3); }
        .opt-pill.active { background: rgba(255,255,255,0.16); color: var(--accent); border-color: var(--accent); }
        .opt-chk { accent-color: var(--accent); cursor: pointer; }
        .opt-range-inp {
            width: 46px; padding: 2px 4px; background: rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.18); border-radius: 3px;
            color: var(--fg); font-size: 10px; text-align: center; outline: none;
        }

        /* Unified Info & Performance overlay (bottom-right, transparent panel, resizable from top-left) */
        #perfOverlay {
            position: absolute; bottom: 42px; right: 10px;
            width: 256px; min-width: 216px; max-width: 420px;
            min-height: 168px; max-height: calc(100% - 82px);
            background: rgba(16, 16, 16, 0.16);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 6px; padding: 8px 10px;
            color: #f4f4f4; font-size: 10px;
            font-family: 'Segoe UI', sans-serif;
            text-shadow: 0 1px 3px rgba(0,0,0,0.95), 0 0 6px rgba(0,0,0,0.85);
            z-index: 18; display: none;
            flex-direction: column; overflow: hidden;
            transition: background 0.18s ease;
        }
        #perfOverlay:hover { background: rgba(16, 16, 16, 0.44); }
        #perfOverlay.show { display: flex; }
        #perfDot {
            display: inline-block; width: 6px; height: 6px; border-radius: 50%;
            background: #66bb6a; margin-right: 5px; vertical-align: middle;
            box-shadow: 0 0 4px rgba(102,187,106,0.7);
        }
        #btnCopyPerf {
            background: transparent; border: none; color: rgba(255,255,255,0.55);
            cursor: pointer; font-size: 10px; padding: 1px 3px; border-radius: 3px;
            font-family: 'Segoe MDL2 Assets', 'Segoe Fluent Icons';
        }
        #btnCopyPerf:hover { color: #ffffff; background: rgba(255,255,255,0.12); }
        #perfResizeHandle {
            position: absolute; top: 0; left: 0;
            width: 12px; height: 12px; cursor: nwse-resize;
            z-index: 3; opacity: 0.45; transition: opacity 0.15s;
        }
        #perfResizeHandle::before {
            content: ''; position: absolute; top: 3px; left: 3px;
            width: 6px; height: 6px;
            border-top: 2px solid rgba(255,255,255,0.75);
            border-left: 2px solid rgba(255,255,255,0.75);
            border-top-left-radius: 1px;
        }
        #perfResizeL {
            position: absolute; top: 12px; left: 0; bottom: 0; width: 6px;
            cursor: ew-resize; z-index: 2;
        }
        #perfResizeT {
            position: absolute; top: 0; left: 12px; right: 28px; height: 6px;
            cursor: ns-resize; z-index: 2;
        }
        #perfOverlay:hover #perfResizeHandle { opacity: 1; }
        #perfHeader {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 5px; cursor: grab; color: #d8d8d8;
            font-size: 10px; font-weight: 600; flex-shrink: 0;
            padding-left: 6px; gap: 6px;
        }
        #perfHeader:active { cursor: grabbing; }
        #perfDragGrip {
            font-size: 11px; color: rgba(255,255,255,0.45);
            letter-spacing: -1px; cursor: grab; transition: color 0.15s;
        }
        #perfHeader:hover #perfDragGrip { color: #ffffff; }
        #perfMetaGrid {
            display: grid; grid-template-columns: repeat(4, 1fr);
            gap: 4px 8px; margin-bottom: 6px;
            padding: 2px 2px 6px 2px; border-bottom: 1px solid rgba(255,255,255,0.18);
            flex-shrink: 0;
        }
        .pm-cell { display: flex; flex-direction: column; min-width: 0; }
        .pm-k { font-size: 9px; color: #cccccc; white-space: nowrap; }
        .pm-v { font-size: 11px; font-weight: 600; color: #ffffff; font-family: 'Consolas', 'Segoe UI', monospace; white-space: nowrap; }
        .pm-sub {
            grid-column: 1 / -1; display: flex; justify-content: space-between;
            font-size: 9px; color: #dcdcdc; padding-top: 2px;
        }
        #perfChart {
            width: 100%; flex: 1; min-height: 28px; display: block;
            background: transparent; border-radius: 2px;
            margin-bottom: 4px;
            filter: drop-shadow(0 1px 2px rgba(0,0,0,0.9));
        }
        .perf-row {
            display: grid; grid-template-columns: 46px 1fr 1fr 1fr;
            gap: 2px; line-height: 1.45; flex-shrink: 0;
            font-family: 'Consolas', 'Segoe UI', monospace;
        }
        .perf-row .p-name { color: #d0d0d0; font-family: 'Segoe UI', sans-serif; }
        .perf-row .p-val { text-align: right; color: #ffffff; }

        /* File structure single panel (independent, sortable, resizable, inline edit) */
        #structPanel {
            position: absolute; top: 36px; right: 8px; bottom: 42px;
            width: 336px; min-width: 260px; max-width: 520px;
            background: var(--control-bg);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 6px; color: var(--fg); font-size: 11px;
            z-index: 21; display: none; flex-direction: column;
            box-shadow: 0 6px 20px rgba(0,0,0,0.45);
        }
        #structPanel.show { display: flex; }
        #structResizeL {
            position: absolute; top: 0; left: 0; bottom: 0; width: 6px;
            cursor: ew-resize; z-index: 3;
        }
        #structResizeL:hover { background: rgba(255,255,255,0.18); border-top-left-radius: 6px; border-bottom-left-radius: 6px; }
        .struct-top {
            display: flex; align-items: center; gap: 6px;
            padding: 8px 10px; border-bottom: 1px solid rgba(255,255,255,0.08);
            flex-shrink: 0; font-weight: 600;
        }
        #structTitle { flex-shrink: 0; font-size: 12px; }
        #structSearch {
            flex: 1; min-width: 0; padding: 3px 8px;
            background: rgba(0,0,0,0.25); border: 1px solid rgba(255,255,255,0.12);
            border-radius: 4px; color: var(--fg); font-size: 11px; outline: none;
        }
        #structSearch:focus { border-color: var(--accent); }
        #btnStructClose {
            width: 20px; height: 20px; border: none; background: transparent;
            color: var(--fg-alt); cursor: pointer; border-radius: 4px;
            display: flex; align-items: center; justify-content: center; font-size: 12px;
            flex-shrink: 0;
        }
        #btnStructClose:hover { background: rgba(255,255,255,0.1); color: var(--fg); }
        .struct-reset {
            background: transparent; border: 1px solid rgba(255,255,255,0.2);
            color: var(--fg-alt); border-radius: 4px; padding: 2px 6px;
            font-size: 10px; cursor: pointer; flex-shrink: 0; white-space: nowrap;
        }
        .struct-reset:hover { color: var(--accent); border-color: var(--accent); }
        .struct-header {
            display: grid; grid-template-columns: 1fr 48px 66px 54px;
            gap: 6px; padding: 6px 12px;
            background: rgba(255,255,255,0.03);
            border-bottom: 1px solid rgba(255,255,255,0.08);
            font-size: 10px; color: var(--fg-alt); flex-shrink: 0;
        }
        .struct-col {
            cursor: pointer; user-select: none; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }
        .struct-col:hover { color: var(--fg); }
        .struct-col.num { text-align: right; }
        .struct-col.sorted { color: var(--accent); }
        .struct-body {
            flex: 1; overflow-y: auto; padding: 4px 6px;
        }
        .struct-body::-webkit-scrollbar { width: 4px; }
        .struct-body::-webkit-scrollbar-track { background: transparent; }
        .struct-body::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
        .s-row {
            display: grid; grid-template-columns: 1fr 48px 66px 54px;
            gap: 6px; align-items: center; min-height: 26px; padding: 3px 6px;
            border-radius: 5px; cursor: pointer; margin-bottom: 1px;
            transition: background 0.12s;
        }
        .s-row:hover { background: rgba(255,255,255,0.07); }
        .s-row.selected { background: rgba(255,255,255,0.16); color: #fff; }
        .s-name {
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .s-type {
            font-size: 9px; padding: 2px 5px; border-radius: 4px;
            background: rgba(255,255,255,0.08); color: #b8c4d0;
            text-align: center; white-space: nowrap; font-weight: 500;
        }
        .s-type.t-sprite { background: rgba(118,185,237,0.14); color: #e0e0e0; }
        .s-type.t-image { background: rgba(78,201,176,0.14); color: #4ec9b0; }
        .s-type.t-audio { background: rgba(218,112,214,0.15); color: #e28ce0; }
        .s-num {
            text-align: right; font-family: 'Consolas', monospace;
            font-size: 10px; color: var(--fg-alt); white-space: nowrap;
        }
        .s-inline-edit {
            padding: 6px 8px; margin: 2px 2px 4px 2px;
            background: rgba(0,0,0,0.25); border-radius: 5px;
            border-left: 2px solid var(--accent);
            display: flex; flex-direction: column; gap: 5px;
        }
        .s-inline-row { display: flex; gap: 4px; align-items: center; }
        .s-inline-edit input[type="text"] {
            flex: 1; padding: 3px 6px; background: rgba(0,0,0,0.35);
            border: 1px solid rgba(255,255,255,0.18); border-radius: 4px;
            color: var(--fg); font-size: 11px; outline: none; min-width: 0;
        }
        .s-inline-edit input[type="text"]:focus { border-color: var(--accent); }
        .insp-btn {
            padding: 3px 8px; background: rgba(255,255,255,0.16);
            border: 1px solid var(--accent); border-radius: 4px;
            color: var(--accent); cursor: pointer; font-size: 10px; white-space: nowrap;
        }
        .insp-btn:hover { background: rgba(255,255,255,0.24); }
        .struct-footer {
            padding: 6px 10px; border-top: 1px solid rgba(255,255,255,0.08);
            font-size: 10px; color: var(--fg-alt); flex-shrink: 0;
            display: flex; flex-wrap: wrap; gap: 4px; align-items: center;
        }
        .sf-tag {
            padding: 1px 6px; border-radius: 3px;
            background: rgba(255,255,255,0.07); color: var(--fg);
            font-size: 10px; white-space: nowrap;
        }
    </style>
</head>
<body>
    <div id="container">
        <div id="bgLayer" class="default"></div>
        <div id="canvasWrap">
            <canvas id="canvas"></canvas>
        </div>
        <div id="zoomInfo"></div>
        <div id="toast"></div>

        <div id="topBar">
            <button class="btn" id="btnStruct" title="文件结构 (F)">
                <span class="icon">&#xE8FD;</span>
            </button>
            <button class="btn" id="btnMeta" title="文件信息与性能监控 (L)">
                <span class="icon">&#xE946;</span>
            </button>
            <button class="btn" id="btnSave" title="保存为PNG">
                <span class="icon">&#xE74B;</span>
            </button>
            <button class="btn" id="btnBg" title="切换背景">
                <span class="icon">&#xEF1F;</span>
            </button>
            <button class="btn" id="btnOpts" title="播放与调试选项">
                <span class="icon">&#xE713;</span>
            </button>
        </div>
        <div id="optsMenu">
            <div class="opt-row"><label id="lblOptReverse">倒放</label><input type="checkbox" id="chkReverse" class="opt-chk"></div>
            <div class="opt-row"><label id="lblOptFillMode">停帧模式</label><div class="opt-pills" id="grpFillMode"><button class="opt-pill active" data-val="Forward" id="optFwd">停在末帧</button><button class="opt-pill" data-val="Backward" id="optBwd">停在首帧</button></div></div>
            <div class="opt-row"><label id="lblOptContentMode">填充模式</label><div class="opt-pills" id="grpContentMode"><button class="opt-pill active" data-val="AspectFit" id="optCmFit">适应</button><button class="opt-pill" data-val="AspectFill" id="optCmZoom">裁剪</button><button class="opt-pill" data-val="Fill" id="optCmFill">拉伸</button></div></div>
            <div class="opt-row">
                <label id="lblOptRange">区间播放</label>
                <div class="opt-pills">
                    <input type="number" id="rngStart" class="opt-range-inp" min="0" value="0">
                    <span style="color:var(--fg-alt)">-</span>
                    <input type="number" id="rngEnd" class="opt-range-inp" min="0" value="0">
                </div>
            </div>
            <div class="opt-row" style="justify-content:flex-end;gap:4px">
                <button class="insp-btn" id="btnApplyRange">应用</button>
                <button class="insp-btn" id="btnResetRange">全片</button>
            </div>
        </div>
        <div id="structPanel">
            <div id="structResizeL"></div>
            <div class="struct-top">
                <span id="structTitle">文件结构</span>
                <input type="text" id="structSearch" placeholder="搜索键名...">
                <button class="struct-reset" id="btnResetDynTop">重置动态元素</button>
                <button id="btnStructClose" title="关闭">&#x2715;</button>
            </div>
            <div class="struct-header" id="structHeader">
                <div class="struct-col" data-sort="name" id="colName">名称 / 键名</div>
                <div class="struct-col" data-sort="type" id="colType">类型</div>
                <div class="struct-col num" data-sort="size" id="colSize">尺寸</div>
                <div class="struct-col num" data-sort="bytes" id="colBytes">大小</div>
            </div>
            <div class="struct-body" id="structBody"></div>
            <div class="struct-footer" id="structFooter">提示：点击表头可排序，双击行可替换图片/文本</div>
        </div>
        <div id="perfOverlay">

        // --- Unified Info & Performance Overlay ---
        function setPerfVisible(show) {
            perfVisible = show;
            perfOverlay.classList.toggle('show', perfVisible);
            if (perfVisible) { clampPerfOverlay(); drawPerfChart(); }
        }

        function clampPerfOverlay() {
            if (!perfOverlay || !perfVisible) return;
            var cw = document.documentElement.clientWidth;
            var ch = document.documentElement.clientHeight;
            var availH = Math.max(100, ch - SAFE_TOP - SAFE_BOTTOM);
            var rect = perfOverlay.getBoundingClientRect();
            if (rect.width === 0) return;
            var w = Math.max(MIN_PERF_W, Math.min(rect.width, Math.max(MIN_PERF_W, cw - SAFE_SIDE * 2)));
            var h = Math.min(Math.max(rect.height, MIN_PERF_H), availH);
            perfOverlay.style.width = w + 'px';
            if (perfOverlay.style.height) perfOverlay.style.height = h + 'px';
            if (perfOverlay.style.left && perfOverlay.style.left !== 'auto') {
                var curH = perfOverlay.getBoundingClientRect().height;
                var l = Math.max(SAFE_SIDE, Math.min(cw - w - SAFE_SIDE, parseFloat(perfOverlay.style.left) || rect.left));
                var t = Math.max(SAFE_TOP, Math.min(ch - curH - SAFE_BOTTOM, parseFloat(perfOverlay.style.top) || rect.top));
                perfOverlay.style.left = l + 'px';
                perfOverlay.style.top = t + 'px';
            } else {
                var curH2 = perfOverlay.getBoundingClientRect().height;
                var r = Math.max(SAFE_SIDE, Math.min(cw - w - SAFE_SIDE, parseFloat(perfOverlay.style.right) || 10));
                var b = Math.max(SAFE_BOTTOM, Math.min(ch - curH2 - SAFE_TOP, parseFloat(perfOverlay.style.bottom) || SAFE_BOTTOM));
                perfOverlay.style.right = r + 'px';
                perfOverlay.style.bottom = b + 'px';
            }
        }

        function startPerfResize(mode, e) {
            if (e.button !== 0) return;
            e.stopPropagation();
            e.preventDefault();
            var rect = perfOverlay.getBoundingClientRect();
            var cw = document.documentElement.clientWidth;
            var ch = document.documentElement.clientHeight;
            var safeBottomEdge = Math.min(rect.bottom, ch - SAFE_BOTTOM);
            perfOverlay.style.left = 'auto';
            perfOverlay.style.top = 'auto';
            perfOverlay.style.right = Math.max(SAFE_SIDE, cw - rect.right) + 'px';
            perfOverlay.style.bottom = Math.max(SAFE_BOTTOM, ch - safeBottomEdge) + 'px';
            perfResize.mode = mode;
            perfResize.startX = e.clientX;
            perfResize.startY = e.clientY;
            perfResize.origW = rect.width;
            perfResize.origH = rect.height;
            perfResize.rightX = rect.right;
            perfResize.bottomY = safeBottomEdge;
        }
        if (perfResizeHandle) perfResizeHandle.addEventListener('mousedown', function(e) { startPerfResize('nw', e); });
        if (perfResizeL) perfResizeL.addEventListener('mousedown', function(e) { startPerfResize('w', e); });
        if (perfResizeT) perfResizeT.addEventListener('mousedown', function(e) { startPerfResize('n', e); });

        document.addEventListener('mousemove', function(e) {
            if (!perfResize.mode) return;
            var maxW = Math.min(420, perfResize.rightX - SAFE_SIDE);
            var maxH = Math.min(340, perfResize.bottomY - SAFE_TOP);
            if (perfResize.mode === 'nw' || perfResize.mode === 'w') {
                var newW = Math.max(MIN_PERF_W, Math.min(maxW, perfResize.origW + (perfResize.startX - e.clientX)));

                var newH = Math.max(MIN_PERF_H, Math.min(maxH, perfResize.origH + (perfResize.startY - e.clientY)));

                perfOverlay.style.top = ny + 'px';

            document.addEventListener('mouseup', function() { perfDrag.active = false; });

        function applyBg() {
            var mode = BG_MODES[bgIndex];
            bgLayer.className = mode;

                var bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();

            }
            bgLayer.style.background = (mode === 'default' || mode === 'checker') ? '' : mode;

        function drawPerfChart() {
            if (!perfChart) return;
            var cw = perfChart.clientWidth || 232;
            var ch = perfChart.clientHeight || 48;
            if (perfChart.width !== cw) perfChart.width = cw;
            if (perfChart.height !== ch) perfChart.height = ch;
            var ctx = perfChart.getContext('2d');
            var w = perfChart.width, h = perfChart.height;
            ctx.clearRect(0, 0, w, h);

            var targetFt = fps > 0 ? 1000 / fps : 50;
            var maxFt = Math.max(33, targetFt * 1.5);
            for (var i = 0; i < perfHistory.length; i++) {
                if (perfHistory[i].ft > maxFt) maxFt = perfHistory[i].ft;
            }
            var refY = Math.round(h - Math.min(h - 4, (targetFt / maxFt) * (h - 4)));
            ctx.save();
            ctx.strokeStyle = 'rgba(255,255,255,0.28)';
            ctx.setLineDash([3, 3]);
            ctx.beginPath();
            ctx.moveTo(0, refY);
            ctx.lineTo(w, refY);
            ctx.stroke();
            ctx.restore();
            ctx.fillStyle = 'rgba(255,255,255,0.55)';
            ctx.font = '9px Consolas, monospace';
            ctx.fillText(Math.round(targetFt) + 'ms', 2, Math.max(9, refY - 2));

            if (perfHistory.length === 0) return;
            var barW = w / PERF_MAX_SAMPLES;
            var startX = w - perfHistory.length * barW;
            for (var j = 0; j < perfHistory.length; j++) {
                var item = perfHistory[j];
                var bh = Math.max(2, Math.min(h - 2, (item.ft / maxFt) * (h - 4)));
                var c = item.ft <= targetFt * 1.25 ? '#66bb6a' : (item.ft <= targetFt * 2 ? '#ffca28' : '#ef5350');
                ctx.fillStyle = j === perfHoverIdx ? '#ffffff' : c;
                ctx.fillRect(startX + j * barW, h - bh, Math.max(1, barW - 1), bh);
            }
        }

        function updatePerfDisplay() {
            var targetFt = fps > 0 ? 1000 / fps : 50;
            var barColor;
            if (currentFrameTime <= targetFt * 1.25) barColor = '#66bb6a';
            else if (currentFrameTime <= targetFt * 2) barColor = '#ffca28';
            else barColor = '#ef5350';
            progressFill.style.background = barColor;

            perfHistory.push({ fps: currentFps, ft: currentFrameTime });
            if (perfHistory.length > PERF_MAX_SAMPLES) perfHistory.shift();

            if (perfVisible) {
                var sumFps = 0, minFps = 999, sumFt = 0, maxFt = 0;
                for (var i = 0; i < perfHistory.length; i++) {
                    var s = perfHistory[i];
                    sumFps += s.fps; if (s.fps < minFps) minFps = s.fps;
                    sumFt += s.ft; if (s.ft > maxFt) maxFt = s.ft;
                }
                var n = perfHistory.length;
                var fpsColor = currentFps >= (fps * 0.8) ? '#66bb6a' : (currentFps >= (fps * 0.5) ? '#ffca28' : '#ef5350');
                var maxColor = maxFt <= targetFt * 1.25 ? '#66bb6a' : (maxFt <= targetFt * 2 ? '#ffca28' : '#ef5350');
                if (perfDot) { perfDot.style.background = barColor; perfDot.style.boxShadow = '0 0 4px ' + barColor; }

                var fpsCurEl = document.getElementById('pFpsCur');

                fpsCurEl.textContent = currentFps; fpsCurEl.style.color = fpsColor;
                document.getElementById('pFpsAvg').textContent = T('PERF_Avg') + ' ' + Math.round(sumFps / n);
                document.getElementById('pFpsMin').textContent = T('PERF_Min') + ' ' + (minFps === 999 ? 0 : minFps);
                flushCurEl.textContent = currentFrameTime.toFixed(1) + 'ms'; flushCurEl.style.color = barColor;
                document.getElementById('pFlushAvg').textContent = T('PERF_Avg') + ' ' + (sumFt / n).toFixed(1);
                flushMaxEl.textContent = T('PERF_Max') + ' ' + maxFt.toFixed(1); flushMaxEl.style.color = maxColor;
                if (perfHoverIdx < 0 && totalFrames > 0) perfFrameLabel.textContent = currentFrame + ' / ' + totalFrames;
                drawPerfChart();
            }
        }

        // --- Save/Copy ---

        function captureAsBase64() {
            var tmp = captureCanvas();

        // --- Image dimension helper ---
        function getImageDimensions(data) {
            return new Promise(function(resolve) {
                if (typeof data === 'string' && data.length > 0) {
                    var img = new Image();
                    img.onload = function() {
                        resolve({width: img.width, height: img.height});
                    };
                    img.onerror = function() {
                        resolve({width: 0, height: 0});
                    };
                    // Check if it's base64 (starts with iVBO for PNG or /9j/ for JPEG)
                    if (data.indexOf('iVBO') === 0 || data.indexOf('/9j/') === 0) {
                        img.src = 'data:image/' + (data.indexOf('iVBO') === 0 ? 'png' : 'jpeg') + ';base64,' + data;
                    } else {
                        resolve({width: 0, height: 0});
                    }
                } else {
                    resolve({width: 0, height: 0});
                }
            });
        }

        // --- Load SVGA (1.x and 2.x) ---
        async function loadFile(base64, jszipSrc, svgaSrc) {
            try {
                statusEl.textContent = T('STATUS_InitSDK');
                log('Loading SVGAPlayer-Web');

                // Wait for SVGA to be available
                var waitCount = 0;
                while (typeof SVGA === 'undefined' && waitCount < 50) {
                    await new Promise(function(r) { setTimeout(r, 100); });
                    waitCount++;
                }

                if (typeof SVGA === 'undefined') {
                    statusEl.textContent = 'SVGA SDK not loaded';
                    log('SVGA SDK not available after waiting');
                    return;
                }

                statusEl.textContent = T('STATUS_Decoding');
                log('Loading SVGA file (' + base64.length + ' chars base64)');

                // Detect format: 1.x (ZIP) or 2.x (zlib)
                var raw = atob(base64);
                var isV1 = raw.charCodeAt(0) === 0x50 && raw.charCodeAt(1) === 0x4B;
                var formatVersion = isV1 ? '1.0' : '2.0';
                log('Detected format: SVGA ' + formatVersion);

                // Use appropriate data URI format
                var dataUri = 'data:svga/' + formatVersion + ';base64,' + base64;

                // Create parser and player
                parser = new SVGA.Parser('#canvas');
                player = new SVGA.Player('#canvas');

                parser.load(dataUri, async function(videoItem) {
                    log('SVGA parsed successfully');

                    // Get metadata using official API
                    var version = videoItem.version || formatVersion;
                    var videoFrames = videoItem.frames || 0;
                    var videoFps = videoItem.FPS || videoItem.fps || 20;
                    var size = videoItem.videoSize || videoItem.size || {};
                    var width = size.width || 0;
                    var height = size.height || 0;
                    var spriteCount = videoItem.sprites ? videoItem.sprites.length : 0;
                    var imageCount = videoItem.images ? Object.keys(videoItem.images).length : 0;
                    var audioCount = videoItem.audios ? videoItem.audios.length : 0;

                    // Get image details with sizes
                    var imageDetails = [];
                    var memorySize = 0;
                    if (videoItem.images) {
                        for (var key in videoItem.images) {
                            if (videoItem.images.hasOwnProperty(key)) {
                                var imgData = videoItem.images[key];
                                var imgSize = 0;
                                var base64Data = null;
                                
                                // Handle both formats: 1.x (base64 string) and 2.x (Uint8Array)
                                if (typeof imgData === 'string') {
                                    // 1.x: base64 string
                                    imgSize = imgData.length * 0.75;
                                    base64Data = imgData;
                                } else if (imgData instanceof Uint8Array || imgData instanceof ArrayBuffer) {
                                    // 2.x: binary data
                                    var bytes = imgData instanceof Uint8Array ? imgData : new Uint8Array(imgData);
                                    imgSize = bytes.length;
                                    // Convert to base64 for image loading
                                    base64Data = btoa(String.fromCharCode.apply(null, bytes));
                                } else if (imgData && imgData.buffer) {
                                    // TypedArray
                                    imgSize = imgData.byteLength;
                                    base64Data = btoa(String.fromCharCode.apply(null, imgData));
                                }
                                memorySize += imgSize;
                                
                                // Get image dimensions
                                var dimensions = base64Data ? await getImageDimensions(base64Data) : {width: 0, height: 0};
                                imageDetails.push({
                                    key: key,
                                    width: dimensions.width,
                                    height: dimensions.height,
                                    size: imgSize
                                });
                            }
                        }
                    }

                    // Log metadata
                    log('=== SVGA Metadata ===');
                    log('Version: ' + version);
                    log('FPS: ' + videoFps);
                    log('Frames: ' + videoFrames);
                    log('Size: ' + width + 'x' + height);
                    log('Sprites: ' + spriteCount);
                    log('Images: ' + imageCount);
                    log('Memory: ' + (memorySize / 1024 / 1024).toFixed(2) + ' MB');
                    imageDetails.forEach(function(img) {
                        log('  ' + img.key + ' --- {"width":' + img.width + ',"height":' + img.height + '}');
                    });
                    log('=== End Metadata ===');

                    // Store metadata
                    svgaData = videoItem;
                    totalFrames = videoFrames;
                    fps = videoFps;
                    svgaMeta = {
                        width: width,
                        height: height,
                        frames: videoFrames,
                        fps: videoFps,
                        sprites: spriteCount,
                        images: imageCount,
                        audios: audioCount,
                        version: version,
                        memory: memorySize,
                        imageDetails: imageDetails
                    };
                    perfHistory = [];
                    lastFrameTs = 0;
                    selectedItem = null;

                    // Set canvas
                    canvas.width = width;
                    canvas.height = height;
                    fitCanvasToContainer();

                    // Update metadata panel & structure tree
                    updateMetaPanel();
                    buildStructureRows();
                    refreshStructureTree();
                    var rs = document.getElementById('rngStart'), re = document.getElementById('rngEnd');
                    if (rs && re) { rs.value = 0; rs.max = Math.max(0, totalFrames - 1); re.value = Math.max(0, totalFrames - 1); re.max = Math.max(0, totalFrames - 1); }

                    // Set up player
                    player.setVideoItem(videoItem);
                    player.loops = 0; // infinite loop
                    player.clearsAfterStop = false;
                    
                    // Use SVGAPlayer-Web built-in scaling
                    if (typeof player.setContentMode === 'function') {
                        player.setContentMode('AspectFit');
                        log('setContentMode: AspectFit');
                    }
                    if (typeof player.setClipsToBounds === 'function') {
                        player.setClipsToBounds(true);
                        log('setClipsToBounds: true');
                    }
                    
                    log('Player configured, starting animation...');

                    // Progress & real-time perf tracking
                    function updateFrameUI(frame) {
                        currentFrame = frame;
                        var p = totalFrames > 0 ? frame / totalFrames : 0;
                        var pct = (p * 100).toFixed(2) + '%';
                        progressFill.style.width = 'calc(' + pct + ' - 10px)';
                        progressThumb.style.left = 'calc(' + pct + ')';
                        timeEl.textContent = fmt(frame, fps) + ' / ' + fmt(totalFrames, fps) + '  ' + frame + '/' + totalFrames;
                    }

                    player.onFrame(function(frame) {
                        var now = performance.now();
                        if (lastFrameTs > 0 && isPlaying) {
                            var dt = now - lastFrameTs;
                            if (dt > 0 && dt < 1000) {
                                currentFrameTime = dt;
                                currentFps = Math.round(1000 / dt);
                                updatePerfDisplay();
                            }
                        }
                        lastFrameTs = now;
                        if (!isDragging) updateFrameUI(frame);
                    });

                    if (typeof player.onFinished === 'function') {
                        player.onFinished(function() {
                            if (!isLooping) {
                                isPlaying = false;
                                btnPlay.querySelector('.icon').textContent = ICON_PLAY;
                            }
                        });
                    }

                    // Start playing
                    player.startAnimation();
                    isPlaying = true;
                    btnPlay.querySelector('.icon').textContent = '\uE769'; // Pause icon
                    statusEl.style.display = 'none';
                    log('Playing SVGA (' + svgaMeta.version + ')');

                    if (window.chrome && window.chrome.webview)
                        window.chrome.webview.postMessage({type:'loaded', width:svgaMeta.width, height:svgaMeta.height});
                }, function(error) {
                    log('SVGA parse error: ' + error);
                    statusEl.textContent = T('STATUS_InvalidFile');
                    if (window.chrome && window.chrome.webview)
                        window.chrome.webview.postMessage({type:'error', message: 'Failed to parse SVGA: ' + error});
                });
            } catch(err) {
                statusEl.textContent = T('STATUS_Error') + ': ' + err.message;
                log('Error: ' + err.message);
                if (window.chrome && window.chrome.webview)
                    window.chrome.webview.postMessage({type:'error', message: err.message});
            }
        }

        // --- Progress interaction ---
        function getProgressFromEvent(e) {
            var rect = progressWrap.getBoundingClientRect();
            return Math.max(0, Math.min(1, (e.clientX - rect.left - 10) / (rect.width - 20)));

        progressWrap.addEventListener('mousedown', function(e) {

        document.addEventListener('mousemove', function(e) {

            }
        });
        document.addEventListener('mouseup', function() { isDragging = false; progressWrap.classList.remove('dragging'); });

        // --- Buttons ---
        var ICON_PLAY = '\uE768', ICON_PAUSE = '\uE769';
        var ICON_LOOP_OFF = '\uE8D8', ICON_LOOP_ON = '\uE777';

        btnPlay.addEventListener('click', function() {
            if (!player) return;
            if (isPlaying) {
                player.pauseAnimation();
                isPlaying = false;
                btnPlay.querySelector('.icon').textContent = ICON_PLAY;

            if (player) player.loops = isLooping ? 0 : 1;
        });

        // --- Frame stepping ---
        function stepFrame(delta) {
            if (!player || totalFrames <= 0) return;
            if (isPlaying) {
                player.pauseAnimation();
                isPlaying = false;
                btnPlay.querySelector('.icon').textContent = ICON_PLAY;
            }
            var nextFrame = Math.max(0, Math.min(totalFrames - 1, currentFrame + delta));
            player.stepToFrame(nextFrame, false);
            currentFrame = nextFrame;
            var p = totalFrames > 0 ? nextFrame / totalFrames : 0;
            var pct = (p * 100).toFixed(2) + '%';
            progressFill.style.width = 'calc(' + pct + ' - 10px)';
            progressThumb.style.left = 'calc(' + pct + ')';
            timeEl.textContent = fmt(nextFrame, fps) + ' / ' + fmt(totalFrames, fps) + '  ' + nextFrame + '/' + totalFrames;
            if (perfVisible) perfFrameLabel.textContent = nextFrame + ' / ' + totalFrames;
        }
        if (btnPrevFrame) btnPrevFrame.addEventListener('click', function() { stepFrame(-1); });
        if (btnNextFrame) btnNextFrame.addEventListener('click', function() { stepFrame(1); });

        // --- File Structure (Single Panel, Sortable, Double-Click Inline Edit) ---
        var structSort = { key: null, dir: 0 };
        var structFilter = '';
        var expandedEditId = null;

        function toggleStruct(forceOpen) {
            structVisible = typeof forceOpen === 'boolean' ? forceOpen : !structVisible;
            if (btnStruct) btnStruct.classList.toggle('pinned', structVisible);
            if (structPanel) structPanel.classList.toggle('show', structVisible);
        }
        if (btnStruct) btnStruct.addEventListener('click', function(e) { e.stopPropagation(); toggleStruct(); });
        if (btnStructClose) btnStructClose.addEventListener('click', function(e) { e.stopPropagation(); toggleStruct(false); });
        if (structSearch) {
            structSearch.addEventListener('input', function() {
                structFilter = structSearch.value.trim().toLowerCase();
                refreshStructureTree();
            });
            structSearch.addEventListener('click', function(e) { e.stopPropagation(); });
        }

        // Left-edge resize for structPanel
        var structResize = { active: false, startX: 0, origW: 0 };
        if (structResizeL) {
            structResizeL.addEventListener('mousedown', function(e) {
                if (e.button !== 0) return;
                e.stopPropagation(); e.preventDefault();
                structResize.active = true;
                structResize.startX = e.clientX;
                structResize.origW = structPanel.getBoundingClientRect().width;
            });
            document.addEventListener('mousemove', function(e) {
                if (!structResize.active) return;
                var maxW = Math.min(520, document.documentElement.clientWidth - 20);
                var newW = Math.max(260, Math.min(maxW, structResize.origW + (structResize.startX - e.clientX)));
                structPanel.style.width = newW + 'px';
            });
            document.addEventListener('mouseup', function() { structResize.active = false; });
        }

        if (btnResetDynTop) {
            btnResetDynTop.addEventListener('click', function(e) {
                e.stopPropagation();
                if (player && typeof player.clearDynamicObjects === 'function') {
                    player.clearDynamicObjects();
                    showToast(T('TOAST_DynamicReset'));
                }
            });
        }

        function escapeHtml(s) {
            return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
        }

        function fmtBytes(b) {
            if (!b || b <= 0) return '-';
            if (b >= 1048576) return (b / 1048576).toFixed(2) + 'M';
            if (b >= 1024) return (b / 1024).toFixed(1) + 'K';
            return b + 'B';
        }

        function updateHeaderSortUI() {
            var cols = [
                { el: colName, k: 'name', label: T('COL_Name') },
                { el: colType, k: 'type', label: T('COL_Type') },
                { el: colSize, k: 'size', label: T('COL_Size') },
                { el: colBytes, k: 'bytes', label: T('COL_Bytes') }
            ];
            cols.forEach(function(c) {
                if (!c.el) return;
                var isSorted = structSort.key === c.k && structSort.dir !== 0;
                c.el.classList.toggle('sorted', isSorted);
                c.el.textContent = c.label + (isSorted ? (structSort.dir > 0 ? ' ▲' : ' ▼') : '');
            });
        }

        document.querySelectorAll('.struct-col[data-sort]').forEach(function(col) {
            col.addEventListener('click', function(e) {
                e.stopPropagation();
                var k = col.dataset.sort;
                if (structSort.key !== k) { structSort.key = k; structSort.dir = 1; }
                else if (structSort.dir === 1) structSort.dir = -1;
                else { structSort.key = null; structSort.dir = 0; }
                refreshStructureTree();
            });
        });

        function buildStructureRows() {
            structNodeList = [];
            if (!svgaData) return;
            var imgs = (svgaMeta && svgaMeta.imageDetails) || [];
            var imgMap = {};
            for (var m = 0; m < imgs.length; m++) imgMap[imgs[m].key] = imgs[m];

            var sprites = svgaData.sprites || [];
            for (var i = 0; i < sprites.length; i++) {
                var sp = sprites[i];
                var key = sp.imageKey || ('sprite_' + i);
                var im = sp.imageKey ? imgMap[sp.imageKey] : null;
                var w = im ? im.width : 0;
                var h = im ? im.height : 0;
                structNodeList.push({
                    id: 'sp_' + i,
                    order: structNodeList.length,
                    kind: 'sprite',
                    typeLabel: T('TYPE_Sprite'),
                    key: key,
                    width: w,
                    height: h,
                    area: w * h,
                    bytes: im ? im.size : 0,
                    matteKey: sp.matteKey || '',
                    kfCount: sp.frames ? sp.frames.length : 0
                });
            }

            for (var j = 0; j < imgs.length; j++) {
                var img = imgs[j];
                structNodeList.push({
                    id: 'im_' + j,
                    order: structNodeList.length,
                    kind: 'image',
                    typeLabel: T('TYPE_Image'),
                    key: img.key,
                    width: img.width,
                    height: img.height,
                    area: img.width * img.height,
                    bytes: img.size || 0
                });
            }

            var audios = svgaData.audios || [];
            for (var k = 0; k < audios.length; k++) {
                var au = audios[k];
                structNodeList.push({
                    id: 'au_' + k,
                    order: structNodeList.length,
                    kind: 'audio',
                    typeLabel: T('TYPE_Audio'),
                    key: au.audioKey || ('audio_' + k),
                    width: 0,
                    height: 0,
                    area: 0,
                    bytes: 0
                });
            }
        }

        function refreshStructureTree() {
            updateHeaderSortUI();
            if (!structBody || !svgaData) return;
            var rows = structNodeList.slice();
            if (structFilter) {
                rows = rows.filter(function(r) {
                    return r.key.toLowerCase().indexOf(structFilter) >= 0 || r.typeLabel.toLowerCase().indexOf(structFilter) >= 0;
                });
            }
            if (structSort.key && structSort.dir !== 0) {
                var k = structSort.key, d = structSort.dir;
                rows.sort(function(a, b) {
                    if (k === 'name') return a.key.localeCompare(b.key) * d;
                    if (k === 'type') return a.kind.localeCompare(b.kind) * d;
                    if (k === 'size') return (a.area - b.area) * d;
                    if (k === 'bytes') return (a.bytes - b.bytes) * d;
                    return 0;
                });
            }

            var html = '';
            for (var i = 0; i < rows.length; i++) {
                var r = rows[i];
                var sizeStr = r.width > 0 ? (r.width + '×' + r.height) : '-';
                var bytesStr = fmtBytes(r.bytes);
                var isSel = selectedItem && selectedItem.id === r.id;
                html += '<div class="s-row' + (isSel ? ' selected' : '') + '" data-row-id="' + r.id + '">'
                    + '<div class="s-name" title="' + escapeHtml(r.key) + '">' + escapeHtml(r.key) + '</div>'
                    + '<div class="s-type t-' + r.kind + '">' + escapeHtml(r.typeLabel) + '</div>'
                    + '<div class="s-num">' + sizeStr + '</div>'
                    + '<div class="s-num">' + bytesStr + '</div>'
                    + '</div>';
                if (expandedEditId === r.id && (r.kind === 'sprite' || r.kind === 'image')) {
                    html += '<div class="s-inline-edit" data-edit-id="' + r.id + '">'
                        + '<div class="s-inline-row">'
                        + '<input type="file" id="svgaImgInput" accept="image/*" style="display:none">'
                        + '<button class="insp-btn" id="btnSvgaReplaceImg">' + T('INSP_ReplaceImage') + '</button>'
                        + '</div>'
                        + '<div class="s-inline-row">'
                        + '<input type="text" id="svgaTextInput" placeholder="' + escapeHtml(T('INSP_TextPlaceholder')) + '">'
                        + '<button class="insp-btn" id="btnSvgaApplyText">' + T('INSP_ApplyText') + '</button>'
                        + '</div>'
                        + '</div>';
                }
            }
            structBody.innerHTML = html;

            structBody.querySelectorAll('.s-row').forEach(function(el) {
                var rid = el.dataset.rowId;
                var item = rows.find(function(x) { return x.id === rid; });
                el.addEventListener('click', function(e) {
                    e.stopPropagation();
                    selectedItem = item;
                    if (structFooter && item) {
                        var tags = [];
                        tags.push('<span class="sf-tag">' + escapeHtml(item.key) + '</span>');
                        tags.push('<span class="sf-tag">' + escapeHtml(item.typeLabel) + '</span>');
                        if (item.width > 0) tags.push('<span class="sf-tag">' + item.width + '×' + item.height + '</span>');
                        if (item.bytes > 0) tags.push('<span class="sf-tag">' + fmtBytes(item.bytes) + '</span>');
                        if (item.kfCount) tags.push('<span class="sf-tag">' + escapeHtml(T('INSP_KeyFrames')) + ': ' + item.kfCount + '</span>');
                        if (item.matteKey) tags.push('<span class="sf-tag">' + escapeHtml(T('INSP_MatteKey')) + ': ' + escapeHtml(item.matteKey) + '</span>');
                        structFooter.innerHTML = tags.join('');
                    }
                    refreshStructureTree();
                });
                el.addEventListener('dblclick', function(e) {
                    e.stopPropagation();
                    if (!item || item.kind === 'audio') return;
                    selectedItem = item;
                    expandedEditId = expandedEditId === rid ? null : rid;
                    refreshStructureTree();
                });
            });

            var btnRep = document.getElementById('btnSvgaReplaceImg');
            var inpImg = document.getElementById('svgaImgInput');
            if (btnRep && inpImg && selectedItem) {
                btnRep.addEventListener('click', function(e) { e.stopPropagation(); inpImg.click(); });
                inpImg.addEventListener('change', function() {
                    var f = inpImg.files && inpImg.files[0];
                    if (!f || !player) return;
                    var reader = new FileReader();
                    reader.onload = function(ev) {
                        player.setImage(ev.target.result, selectedItem.key);
                        showToast(T('TOAST_ImageUpdated'));
                    };
                    reader.readAsDataURL(f);
                });
            }
            var btnTxt = document.getElementById('btnSvgaApplyText');
            if (btnTxt && selectedItem) {
                btnTxt.addEventListener('click', function(e) {
                    e.stopPropagation();
                    var val = document.getElementById('svgaTextInput').value;
                    if (!player) return;
                    player.setText({ text: val, family: 'Arial', size: '24px', color: '#FFFFFF' }, selectedItem.key);
                    showToast(T('TOAST_TextUpdated'));
                });
            }
        }

        // --- Keyboard shortcuts ---
        document.addEventListener('keydown', function(e) {
            if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
            if (e.key === 'ArrowLeft') { e.preventDefault(); stepFrame(-1); showControls(); }
            else if (e.key === 'ArrowRight') { e.preventDefault(); stepFrame(1); showControls(); }
            else if (e.key === ' ') { e.preventDefault(); btnPlay.click(); showControls(); }
            else if (e.key === 'l' || e.key === 'L') { e.preventDefault(); toggleMetaPanel(); showControls(); }
            else if (e.key === 'f' || e.key === 'F') { e.preventDefault(); toggleStruct(); showControls(); }
        });

        // --- Playback & Debug Options (Range / Reverse / ContentMode / FillMode) ---
        var isReverse = false;
        var activeRange = null;

        function startWithCurrentMode() {
            if (!player) return;
            if (activeRange && typeof player.startAnimationWithRange === 'function') {
                player.startAnimationWithRange(activeRange, isReverse);
            } else if (typeof player.startAnimation === 'function') {
                player.startAnimation(isReverse);
            }
            isPlaying = true;
            btnPlay.querySelector('.icon').textContent = ICON_PAUSE;
        }

        if (btnOpts) {
            btnOpts.addEventListener('click', function(e) {
                e.stopPropagation();
                colorPicker.classList.remove('show');
                optsMenu.classList.toggle('show');
            });
        }
        var chkReverse = document.getElementById('chkReverse');
        if (chkReverse) chkReverse.addEventListener('change', function() {
            isReverse = chkReverse.checked;
            startWithCurrentMode();
        });
        document.querySelectorAll('#grpFillMode .opt-pill').forEach(function(b) {
            b.addEventListener('click', function(e) {
                e.stopPropagation();
                if (player) player.fillMode = b.dataset.val;
                document.querySelectorAll('#grpFillMode .opt-pill').forEach(function(x) { x.classList.toggle('active', x === b); });
            });
        });
        document.querySelectorAll('#grpContentMode .opt-pill').forEach(function(b) {
            b.addEventListener('click', function(e) {
                e.stopPropagation();
                var mode = b.dataset.val;
                if (player && typeof player.setContentMode === 'function') {
                    var wrap = document.getElementById('canvasWrap');
                    if (wrap && wrap.clientWidth > 0 && wrap.clientHeight > 0) {
                        canvas.style.width = '100%';
                        canvas.style.height = '100%';
                        canvas.width = wrap.clientWidth;
                        canvas.height = wrap.clientHeight;
                    }
                    player.setContentMode(mode);
                    if (!isPlaying && typeof player.stepToFrame === 'function') player.stepToFrame(currentFrame, false);
                }
                document.querySelectorAll('#grpContentMode .opt-pill').forEach(function(x) { x.classList.toggle('active', x === b); });
            });
        });
        var btnApplyRange = document.getElementById('btnApplyRange');
        var btnResetRange = document.getElementById('btnResetRange');
        if (btnApplyRange) btnApplyRange.addEventListener('click', function(e) {
            e.stopPropagation();
            var s = Math.max(0, parseInt(document.getElementById('rngStart').value, 10) || 0);
            var end = Math.max(s, parseInt(document.getElementById('rngEnd').value, 10) || 0);
            if (totalFrames > 0) end = Math.min(totalFrames - 1, end);
            activeRange = { location: s, length: Math.max(1, end - s + 1) };
            startWithCurrentMode();
        });
        if (btnResetRange) btnResetRange.addEventListener('click', function(e) {
            e.stopPropagation();
            activeRange = null;
            var rs = document.getElementById('rngStart'), re = document.getElementById('rngEnd');
            if (rs && re) { rs.value = 0; re.value = Math.max(0, totalFrames - 1); }
            startWithCurrentMode();
        });

        // --- Messages from C# ---
        window.addEventListener('message', function(e) {
            var msg = e.data;
            if (!msg || typeof msg !== 'object') return;
            if (msg.type === 'loadFile') { fileSize = msg.fileSize || 0; loadFile(msg.base64, msg.jszipSrc, msg.svgaSrc); }
        });

        // --- Ready ---
        log('Page ready');
        if (window.chrome && window.chrome.webview)
            window.chrome.webview.postMessage({type: 'ready'});
    })();
    </script>
</body>
</html>
